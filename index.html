/* layout: one narrow column, a 7-step strip on top, one step per screen, prev/next at the bottom */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#1E2A3A; --muted:#5C6B7E; --line:#D3DAE4;
  --accent:#2F4F7F; --on-accent:#FFFFFF; --accent-soft:#E3EAF4;
  --red:#D2504B; --yellow:#D9A400; --blue:#3F7FC4; --green:#3A9667;
  --display:"Gowun Batang","Noto Serif KR",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131920; --surface:#1C2430; --ink:#E6EBF2; --muted:#9BA8B9; --line:#303B4B;
    --accent:#93B4E4; --on-accent:#10203A; --accent-soft:#263447;
    --red:#E8736E; --yellow:#E6BC3A; --blue:#6FA6E3; --green:#5FBE8D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131920; --surface:#1C2430; --ink:#E6EBF2; --muted:#9BA8B9; --line:#303B4B;
  --accent:#93B4E4; --on-accent:#10203A; --accent-soft:#263447;
  --red:#E8736E; --yellow:#E6BC3A; --blue:#6FA6E3; --green:#5FBE8D;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:1.7rem;margin:0;line-height:1.2;letter-spacing:-.01em}
.date{color:var(--muted);font-size:.875rem}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs a{flex:1;text-align:center;padding:8px 14px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:500;font-size:.95rem}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px 6px 6px;font:inherit;font-size:.85rem;cursor:pointer}
.steps button .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:.75rem;font-weight:600;font-variant-numeric:tabular-nums}
.steps button.done .n{background:var(--accent);color:var(--on-accent)}
.steps button[aria-current="step"]{border-color:var(--accent);color:var(--ink);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.card h2{font-family:var(--display);font-size:1.3rem;margin:0;line-height:1.3;text-wrap:balance}
.card h2 .n{color:var(--accent);margin-right:8px;font-variant-numeric:tabular-nums}
.card h3{font-size:1rem;margin:10px 0 0;font-weight:600;text-wrap:balance}
.hint{color:var(--muted);font-size:.9rem;margin:0}
textarea{width:100%;min-height:104px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;padding:12px;line-height:1.6}
textarea.small{min-height:76px}
textarea::placeholder{color:var(--muted);opacity:.8}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:.9rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--on-c,var(--on-accent));font-weight:500}
.mood-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mood{--c:var(--accent);border:2px solid transparent;border-radius:var(--r);background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--ink);padding:14px 12px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:86px}
.mood .name{display:flex;align-items:center;gap:8px;font-weight:600}
.mood .dot{width:14px;height:14px;border-radius:50%;background:var(--c)}
.mood .sub{font-size:.82rem;color:var(--muted)}
.mood .cnt{font-size:.82rem;font-weight:600;margin-top:auto}
.mood[aria-expanded="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 30%,var(--surface))}
.red{--c:var(--red);--on-c:#fff}.yellow{--c:var(--yellow);--on-c:#221a00}.blue{--c:var(--blue);--on-c:#fff}.green{--c:var(--green);--on-c:#fff}
.mood-panel{border-left:4px solid var(--c);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:10px}
.opt{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.opt.on{border-color:var(--accent)}
.opt > button{display:grid;grid-template-columns:22px 1fr;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;padding:12px;cursor:pointer}
.opt.on > button{background:var(--accent-soft)}
.opt .box{width:22px;height:22px;border:2px solid var(--line);border-radius:6px;margin-top:2px;display:grid;place-items:center;color:var(--on-accent);font-size:.8rem;line-height:1}
.opt.on .box{background:var(--accent);border-color:var(--accent)}
.opt .t{font-weight:600}
.opt .d{display:block;font-size:.9rem;color:var(--muted)}
.opt .e{display:block;font-size:.88rem;margin-top:4px}
.opt .e::before{content:"예) ";color:var(--muted)}
.opt .why{padding:0 12px 12px;display:flex;flex-direction:column;gap:6px}
.opt .why label{font-size:.88rem;color:var(--ink);font-weight:500}
.opt .why label .d{font-weight:400}
.opts{display:flex;flex-direction:column;gap:8px}
.nav{display:flex;gap:10px;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px 18px;font:inherit;font-weight:500;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);margin-left:auto}
.btn.sm{padding:7px 12px;font-size:.88rem}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.note{font-size:.85rem;color:var(--muted);margin:0}
.msg{font-size:.9rem;margin:0;color:var(--red)}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.rec summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.rec summary::-webkit-details-marker{display:none}
.rec .when{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.rec .sit{font-weight:500;overflow-wrap:anywhere}
.rec .dots{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.8rem;border-radius:999px;padding:2px 9px;background:color-mix(in srgb,var(--c,var(--accent)) 22%,var(--surface))}
.rec .body{border-top:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.rec dl{margin:0;display:flex;flex-direction:column;gap:10px}
.rec dt{font-size:.82rem;color:var(--accent);font-weight:600}
.rec dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.rec .acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:32px 12px}
footer{font-size:.8rem;color:var(--muted);text-align:center}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.mood,.tabs a{transition:background-color .15s,border-color .15s}}

.stack{display:flex;flex-direction:column;gap:14px}
h1 small{font-family:var(--body);font-size:.9rem;font-weight:500;color:var(--muted);margin-left:6px}
.bar{height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell{aspect-ratio:1/1;min-height:58px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px}
.cell .num{font-family:var(--display);font-size:1.25rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.cell .st{font-size:.7rem;color:var(--muted);line-height:1.2;font-variant-numeric:tabular-nums}
.cell .dots{display:flex;gap:3px;height:7px}
.cell .dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.cell.done{background:var(--accent-soft);border-color:var(--accent)}
.cell.draft{border-style:dashed;border-color:var(--accent)}
.cell.next{border:2px solid var(--accent)}
.cell.next .st{color:var(--accent);font-weight:600}
.cell:disabled{opacity:.45;cursor:default;background:transparent}
.daytop{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.daytop h2{font-family:var(--display);font-size:1.5rem;margin:0}
.daytop a{color:var(--accent);text-decoration:none;font-weight:500;margin-right:auto;padding:6px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sharecard{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px;font-size:.92rem;line-height:1.6}
.chip:disabled{opacity:.4;cursor:default}
.finish{display:flex;gap:10px;flex-wrap:wrap}
.finish .primary{margin-left:0;flex:1 1 200px}
</style>
</head>

function h(tag,attrs){
  var el=document.createElement(tag),i,c;
  if(attrs)for(var k in attrs){
    if(k==="text")el.textContent=attrs[k];
    else if(k.slice(0,2)==="on")el.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]!==false&&attrs[k]!=null)el.setAttribute(k,attrs[k]);
  }
  for(i=2;i<arguments.length;i++){c=arguments[i];if(c==null||c===false)continue;
    if(Array.isArray(c))c.forEach(function(x){if(x)el.appendChild(x);});
    else el.appendChild(typeof c==="string"?document.createTextNode(c):c);}
  return el;
}

function stepFilled(i,S){
  var any=function(o){return Object.keys(o).some(function(k){return Array.isArray(o[k])?o[k].length:true;});};
  return [S.situation.trim(),S.body.length||S.bodyText.trim(),any(S.moods),S.thought.trim()||any(S.autos)||any(S.errors),
    S.understand.trim(),S.needs.length||S.needText.trim(),S.actions.length||S.actionText.trim()||S.actionPlan.trim(),any(S.checkMoods)||S.checkText.trim()][i]?true:false;
}
function fmt(ts){var d=new Date(ts),p=function(n){return String(n).padStart(2,"0");};
  return d.getFullYear()+"."+p(d.getMonth()+1)+"."+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());}
function moodText(m){return MOODS.filter(function(x){return m&&m[x.k]&&m[x.k].length;}).map(function(x){return x.name+": "+m[x.k].join(", ");}).join("\n");}
function pickText(list,store,alt){return list.filter(function(o){return store&&Object.prototype.hasOwnProperty.call(store,o.k);})
  .map(function(o){return "· "+o.t+(store[o.k]?" — "+store[o.k]:"")+(alt&&alt[o.k]?"\n  ↳ 다르게 생각해 보면: "+alt[o.k]:"");}).join("\n");}
function fields(r){
  return [["1. 상황",r.situation],
   ["2. 신체 반응",[(r.body||[]).join(", "),r.bodyText].filter(Boolean).join("\n")],
   ["3. 감정 관찰",moodText(r.moods)],
   ["4. 생각 관찰 · 스친 생각",r.thought],
   ["4. 생각 관찰 · 자동적 생각",pickText(AUTOS,r.autos,r.autosAlt)],
   ["4. 생각 관찰 · 인지 오류",pickText(ERRORS,r.errors,r.errorsAlt)],
   ["5. 이해",r.understand],
   ["6. 욕구",[(r.needs||[]).join(", "),r.needText].filter(Boolean).join("\n")],
   ["7. 다음 행동",[(r.actions||[]).join(", "),r.actionText,r.actionPlan?"구체적인 계획: "+r.actionPlan:""].filter(Boolean).join("\n")],
   ["8. 점검",[moodText(r.checkMoods),r.checkText].filter(Boolean).join("\n")]
  ].filter(function(f){return f[1]&&String(f[1]).trim();});
}

    h("p",{"class":"note",text:"기록은 이 기기의 이 브라우저에만 저장되며 누구에게도 전송되지 않습니다. 브라우저 데이터를 지우면 함께 사라지니 가끔 백업해 두세요."}));
}
function hasAny(){return Object.keys(DB.days).some(function(k){return dayState(k)!=="empty";});}
function applyImport(data){DB={days:data.days};persist();pendingImport=null;calMsg=storeOk?"백업 파일의 기록을 불러왔습니다.":"불러온 기록을 저장하지 못했습니다.";renderCal();}
function backupBar(){
  if(pendingImport){
    return h("div",{"class":"acts"},h("span",{"class":"msg",text:"지금 이 브라우저의 기록을 백업 파일 내용으로 바꿉니다."}),
      h("button",{type:"button","class":"btn sm danger",text:"바꾸기",onclick:function(){applyImport(pendingImport);}}),
      h("button",{type:"button","class":"btn sm",text:"취소",onclick:function(){pendingImport=null;renderCal();}}));
  }
  var file=h("input",{type:"file",id:"backup-file",accept:"application/json,.json",hidden:"hidden"});
  file.addEventListener("change",function(){
    var f=file.files&&file.files[0];if(!f)return;var rd=new FileReader();
    rd.onload=function(){
      try{var data=JSON.parse(rd.result);
        if(!data||data.app!=="thought-record-20days"||typeof data.days!=="object"||!data.days)throw new Error("format");
        if(hasAny()){pendingImport=data;renderCal();}else applyImport(data);
      }catch(e){calMsg="불러오지 못했습니다. 이 페이지에서 내려받은 백업 파일인지 확인해 주세요.";renderCal();}
    };
    rd.onerror=function(){calMsg="파일을 읽지 못했습니다.";renderCal();};
    rd.readAsText(f);
  });
  var exp=h("button",{type:"button","class":"btn sm",text:"백업 파일 내려받기",disabled:hasAny()?null:"disabled",onclick:function(){
    var d=new Date(),p=function(n){return String(n).padStart(2,"0");};
    var blob=new Blob([JSON.stringify({app:"thought-record-20days",version:1,exportedAt:Date.now(),days:DB.days},null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob),a=h("a",{href:url,download:"생각기록20일-백업-"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+".json"});
    document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);}});
  var imp=h("button",{type:"button","class":"btn sm",text:"백업 파일 불러오기",onclick:function(){file.click();}});
  var armed=false;
  var reset=h("button",{type:"button","class":"btn sm danger",text:"모두 지우고 처음부터",disabled:hasAny()?null:"disabled",onclick:function(){
    if(!armed){armed=true;reset.textContent="한 번 더 누르면 20일 기록이 모두 지워집니다";setTimeout(function(){armed=false;reset.textContent="모두 지우고 처음부터";},4000);return;}
    DB={days:{}};persist();calMsg="기록을 모두 지웠습니다.";renderCal();}});
  return h("div",{"class":"acts"},exp,imp,reset,file);
}

/* ---------- one day, top to bottom ---------- */
function renderDay(n){
  cur=n;S=DB.days[n]=Object.assign(blank(),DB.days[n]||{});openMood={3:null,7:null};
  var box=document.getElementById("view-day"),i;
  sections=STEPS.map(function(_,i){return h("section",{"class":"card",id:"sec-"+(i+1)});});
  shareSel={};shareEl=h("section",{"class":"card",id:"share"});
  var msg=h("p",{"class":"msg",hidden:"hidden"});
  var copy=h("button",{type:"button","class":"btn",text:"글로 복사",onclick:function(){
    navigator.clipboard.writeText(asText(n,S)).then(function(){copy.textContent="복사했습니다";},function(){copy.textContent="복사하지 못했습니다";});
    setTimeout(function(){copy.textContent="글로 복사";},2000);}});
  var fin=h("button",{type:"button","class":"btn primary",text:S.done?"고친 내용 저장하고 달력으로":n+"일차 완료",onclick:function(){
    if(!anyFilled(S)){msg.textContent="아직 적은 내용이 없습니다. 한 단계라도 적은 뒤 완료해 주세요.";msg.hidden=false;return;}
    S.done=true;if(!S.startedAt)S.startedAt=Date.now();if(!S.doneAt)S.doneAt=Date.now();S.updatedAt=Date.now();
    clearTimeout(saveT);saveT=null;persist();
    if(!storeOk){msg.textContent="저장하지 못했습니다. 내용은 화면에 그대로 있습니다. 글로 복사해 두고 브라우저 저장 공간을 확인해 주세요.";msg.hidden=false;return;}
    location.hash="#calendar";}});
  box.replaceChildren(
    h("div",{"class":"daytop"},h("a",{href:"#calendar",text:"← 달력"}),h("h2",{text:n+"일차"}),h("span",{"class":"date",text:fmt(S.startedAt||Date.now()).slice(0,10)})),
    h("p",{"class":"note",id:"saved",text:"위에서 아래로 차례대로 적어 내려가세요. 적는 대로 자동 저장됩니다."}));
  sections.forEach(function(s){box.appendChild(s);});box.appendChild(shareEl);
  box.appendChild(msg);box.appendChild(h("div",{"class":"finish"},fin,copy));
  for(i=0;i<sections.length;i++)rr(i);
}

/* ---------- routing ---------- */
function route(){
  flush();
  var m=/^#day-(\d+)$/.exec(location.hash),n=m?parseInt(m[1],10):0,day=n>=1&&n<=TOTAL&&unlocked(n);
  document.getElementById("view-cal").hidden=day;
  document.getElementById("view-day").hidden=!day;
  if(day)renderDay(n);else{S=null;renderCal();}
  try{window.scrollTo(0,0);}catch(e){}
}
window.addEventListener("hashchange",route);
var now=new Date();
document.getElementById("today").textContent=now.getFullYear()+"년 "+(now.getMonth()+1)+"월 "+now.getDate()+"일 "+"일월화수목금토".charAt(now.getDay())+"요일";
route();
})();
</script>
</body>
</html>
